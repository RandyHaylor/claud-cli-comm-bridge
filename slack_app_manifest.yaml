# Paste at api.slack.com/apps -> Create New App -> From a manifest.
# Replace YOUR-HOST with the public host name of your bridge (the tunnel to its public port).
display_information:
  name: claude-bridge
features:
  bot_user:
    display_name: claude-bridge
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR-HOST/slack/events
    bot_events:
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
